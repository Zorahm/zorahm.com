<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>5xx — ZorahM</title>
    <style>
      :root {
        --void: #03050a;
        --ink: #e8edf4;
        --dim: #78828f;
        --gold: #d9a441;
        --line: rgba(232, 237, 244, 0.13);
        --display: "Arial Black", system-ui, sans-serif;
        --mono: ui-monospace, "SF Mono", Menlo, monospace;
        --pad: clamp(20px, 5vw, 80px);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        background: radial-gradient(
            circle at 50% 30%,
            rgba(217, 164, 65, 0.06),
            transparent 60%
          ),
          var(--void);
        color: var(--ink);
        font-family: var(--mono);
        font-size: 15px;
        line-height: 1.7;
        -webkit-font-smoothing: antialiased;
      }

      ::selection {
        background: var(--gold);
        color: #000;
      }

      a {
        color: inherit;
      }

      .mark {
        position: fixed;
        top: var(--pad);
        left: var(--pad);
        font-family: var(--display);
        font-weight: 800;
        font-size: 19px;
        color: var(--ink);
        text-decoration: none;
      }

      .mark span {
        color: var(--gold);
      }

      .frame {
        position: fixed;
        bottom: calc(var(--pad) - 6px);
        left: var(--pad);
        font-size: 11px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--dim);
      }

      main {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 14vh var(--pad) 12vh;
        text-align: center;
      }

      .copy {
        max-width: 46ch;
      }

      .dots {
        display: block;
        margin: 0 auto 28px;
      }

      .eyebrow {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-size: 11px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--gold);
        margin: 0 0 22px;
      }

      .eyebrow::before {
        content: "";
        width: 26px;
        height: 1px;
        background: var(--gold);
        opacity: 0.6;
      }

      h1 {
        font-family: var(--display);
        font-weight: 800;
        line-height: 0.98;
        letter-spacing: -0.03em;
        margin: 0 0 22px;
        font-size: clamp(1.9rem, 5.4vw, 3.4rem);
      }

      .body {
        margin: 0 auto 18px;
        color: #d8dfe8;
      }

      .muted {
        margin: 0;
        color: var(--dim);
      }

      .biglink {
        display: inline-flex;
        align-items: baseline;
        gap: 14px;
        margin-top: 26px;
        text-decoration: none;
        font-family: var(--display);
        font-weight: 500;
        letter-spacing: -0.02em;
        color: var(--ink);
        font-size: clamp(1.2rem, 3vw, 1.7rem);
        border-bottom: 1px solid var(--line);
        padding-bottom: 8px;
      }

      .biglink i {
        font-style: normal;
        font-size: 0.6em;
        color: var(--gold);
      }

      .biglink:hover {
        color: var(--gold);
        border-color: var(--gold);
      }

      .biglink:focus-visible,
      .mark:focus-visible {
        outline: 1px solid var(--gold);
        outline-offset: 5px;
      }
    </style>
  </head>
  <body>
    <a class="mark" href="/">Z<span>\</span>M</a>
    <div class="frame">5xx — service unavailable</div>

    <main>
      <div class="copy">
        <svg
          class="dots"
          width="220"
          height="56"
          viewBox="0 0 220 56"
          aria-hidden="true"
        >
          <circle cx="18" cy="30" r="2.5" fill="#78828f" opacity="0.5" />
          <circle cx="46" cy="14" r="2" fill="#78828f" opacity="0.4" />
          <circle cx="60" cy="38" r="3" fill="#78828f" opacity="0.6" />
          <circle cx="92" cy="22" r="2" fill="#78828f" opacity="0.35" />
          <circle cx="110" cy="30" r="4.5" fill="#d9a441" />
          <circle cx="132" cy="16" r="2.5" fill="#78828f" opacity="0.5" />
          <circle cx="150" cy="40" r="2" fill="#78828f" opacity="0.4" />
          <circle cx="172" cy="24" r="3" fill="#78828f" opacity="0.55" />
          <circle cx="200" cy="34" r="2" fill="#78828f" opacity="0.35" />
        </svg>

        <p class="eyebrow">Error 5xx</p>
        <h1>Something broke on our end</h1>
        <p class="body">
          Whatever's behind this page went quiet. Might be a deploy, might be
          a hiccup — it usually clears in a minute.
        </p>
        <p class="muted">
          If it's still down in a few minutes, it's not your connection.
        </p>
        <a class="biglink" href="/"
          >Back to the main page<i aria-hidden="true">→</i></a
        >
      </div>
    </main>
  </body>
</html>
