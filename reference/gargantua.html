<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Gargantua — Interactive 3D Black Hole</title>
<style>
  :root{
    --fg:#e9eef6;
    --muted:#7c8899;
    --line:rgba(255,255,255,.10);
    --panel:rgba(10,13,20,.62);
    --accent:#ffb46a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    color:var(--fg)}
  #gl{display:block;width:100vw;height:100vh;cursor:grab;touch-action:none}
  #gl.dragging{cursor:grabbing}

  .ui{position:fixed;z-index:5;user-select:none;-webkit-user-select:none}
  .ui.hidden{opacity:0;pointer-events:none}
  .ui{transition:opacity .35s ease}

  #brand{top:22px;left:26px}
  #brand h1{margin:0;font-size:13px;font-weight:600;letter-spacing:.34em;text-transform:uppercase}
  #brand p{margin:6px 0 0;font-size:11px;color:var(--muted);letter-spacing:.10em}

  #stats{top:22px;right:26px;text-align:right;font-variant-numeric:tabular-nums}
  #stats .fps{font-size:12px;letter-spacing:.14em;color:var(--muted)}
  #stats .fps b{color:var(--fg);font-weight:600}

  #hint{bottom:20px;left:26px;font-size:11px;color:var(--muted);letter-spacing:.06em;line-height:1.7}
  #hint kbd{font:inherit;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--fg);
    background:rgba(255,255,255,.04)}

  #panel{bottom:20px;right:26px;width:236px;padding:14px 16px 12px;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  #panel h2{margin:0 0 12px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .row{margin:0 0 11px}
  .row label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:5px;letter-spacing:.05em}
  .row label span{color:var(--fg);font-variant-numeric:tabular-nums}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:2px;border-radius:2px;
    background:rgba(255,255,255,.16);outline:none;margin:0}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;
    background:var(--fg);cursor:pointer;box-shadow:0 0 0 3px rgba(255,180,106,.16)}
  input[type=range]::-moz-range-thumb{width:11px;height:11px;border:0;border-radius:50%;background:var(--fg);cursor:pointer}
  .btns{display:flex;gap:8px;margin-top:12px}
  .btns button{flex:1;padding:6px 0;font:inherit;font-size:11px;letter-spacing:.08em;color:var(--fg);
    background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:7px;cursor:pointer}
  .btns button:hover{background:rgba(255,255,255,.10)}
  .btns button.on{color:#0a0d14;background:var(--accent);border-color:transparent}

  #err{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:40px;
    background:#05070b;z-index:20;font-size:14px;line-height:1.7;color:var(--muted)}

  @media (max-width:820px){
    #panel{display:none}
    #hint{display:none}
    #brand{top:16px;left:16px}
    #stats{top:16px;right:16px}
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="brand" class="ui">
  <h1>Gargantua</h1>
  <p>Schwarzschild geodesic ray-tracer</p>
</div>

<div id="stats" class="ui">
  <div class="fps"><b id="fps">–</b> FPS · <span id="res">–</span></div>
</div>

<div id="hint" class="ui">
  Drag to orbit · Scroll to zoom<br>
  <kbd>H</kbd> interface · <kbd>R</kbd> reset · <kbd>Space</kbd> auto-orbit · <kbd>F</kbd> fullscreen
</div>

<div id="panel" class="ui">
  <h2>Parameters</h2>
  <div class="row"><label>Quality <span id="v-steps"></span></label>
    <input id="s-steps" type="range" min="80" max="320" step="10" value="240"></div>
  <div class="row"><label>Disk brightness <span id="v-bright"></span></label>
    <input id="s-bright" type="range" min="0" max="250" step="1" value="100"></div>
  <div class="row"><label>Disk rotation <span id="v-spin"></span></label>
    <input id="s-spin" type="range" min="0" max="300" step="1" value="100"></div>
  <div class="row"><label>Lensing <span id="v-lens"></span></label>
    <input id="s-lens" type="range" min="0" max="200" step="1" value="100"></div>
  <div class="row"><label>Glow <span id="v-bloom"></span></label>
    <input id="s-bloom" type="range" min="0" max="200" step="1" value="100"></div>
  <div class="btns">
    <button id="b-auto" class="on">Auto-orbit</button>
    <button id="b-reset">Reset</button>
  </div>
</div>

<div id="err"><div id="err-msg"></div></div>

<script>
"use strict";
(function () {

/* ------------------------------------------------------------------ *
 *  Shaders
 * ------------------------------------------------------------------ */

const VERT = `
attribute vec2 aPos;
varying vec2 vUv;
void main(){
  vUv = aPos * 0.5 + 0.5;
  gl_Position = vec4(aPos, 0.0, 1.0);
}`;

/* ---- main pass: relativistic ray-tracing of a Schwarzschild black hole ---- */
const FRAG_SCENE = `
precision highp float;

varying vec2 vUv;

uniform vec2  uRes;
uniform float uTime;
uniform vec3  uCamPos;
uniform mat3  uCamMat;     // columns: right, up, forward
uniform float uTanFov;
uniform int   uSteps;
uniform float uBright;     // disk brightness
uniform float uSpin;       // disk angular speed multiplier
uniform float uLens;       // lensing strength multiplier

#define MAX_STEPS  320
#define RS         1.0     // Schwarzschild radius (units of the whole scene)
#define DISK_IN    2.15
#define DISK_OUT   11.0
#define ESCAPE     140.0
#define SHEAR_PERIOD 11.0
#define PI         3.14159265

/* ---------------------------- hash / noise ---------------------------- */

float hash31(vec3 p){
  p = fract(p * vec3(0.1031, 0.1030, 0.0973));
  p += dot(p, p.yxz + 33.33);
  return fract((p.x + p.y) * p.z);
}

vec3 hash33(vec3 p){
  p = vec3(dot(p, vec3(127.1, 311.7,  74.7)),
           dot(p, vec3(269.5, 183.3, 246.1)),
           dot(p, vec3(113.5, 271.9, 124.6)));
  return fract(sin(p) * 43758.5453123);
}

float vnoise(vec3 x){
  vec3 i = floor(x);
  vec3 f = fract(x);
  f = f * f * (3.0 - 2.0 * f);
  float n000 = hash31(i + vec3(0.0, 0.0, 0.0));
  float n100 = hash31(i + vec3(1.0, 0.0, 0.0));
  float n010 = hash31(i + vec3(0.0, 1.0, 0.0));
  float n110 = hash31(i + vec3(1.0, 1.0, 0.0));
  float n001 = hash31(i + vec3(0.0, 0.0, 1.0));
  float n101 = hash31(i + vec3(1.0, 0.0, 1.0));
  float n011 = hash31(i + vec3(0.0, 1.0, 1.0));
  float n111 = hash31(i + vec3(1.0, 1.0, 1.0));
  return mix(mix(mix(n000, n100, f.x), mix(n010, n110, f.x), f.y),
             mix(mix(n001, n101, f.x), mix(n011, n111, f.x), f.y), f.z);
}

const mat3 M3 = mat3( 0.00,  0.80,  0.60,
                     -0.80,  0.36, -0.48,
                     -0.60, -0.48,  0.64);

float fbm4(vec3 p){
  float a = 0.5, s = 0.0;
  for (int i = 0; i < 4; i++){
    s += a * vnoise(p);
    p = M3 * p * 2.02;
    a *= 0.5;
  }
  return s;
}

float fbm5(vec3 p){
  float a = 0.5, s = 0.0;
  for (int i = 0; i < 5; i++){
    s += a * vnoise(p);
    p = M3 * p * 2.03;
    a *= 0.5;
  }
  return s;
}

/* ------------------------------ starfield ----------------------------- */

vec3 starLayer(vec3 rd, float scale, float thresh, float gain){
  vec3 p  = rd * scale;
  vec3 id = floor(p);
  vec3 f  = fract(p) - 0.5;
  vec3 h  = hash33(id);
  if (h.x > thresh) return vec3(0.0);

  vec3  off  = (hash33(id + 11.7) - 0.5) * 0.72;
  float d    = length(f - off);
  float mag  = 0.05 + pow(h.y, 4.0);                // few bright, many faint
  float core = 0.00045 / (d * d + 0.00006);
  core = min(core, 60.0);

  // subtle twinkle
  float tw = 0.82 + 0.18 * sin(uTime * (1.2 + 3.0 * h.z) + h.y * 62.8);

  // colour temperature of the star
  vec3 warm = vec3(1.00, 0.78, 0.55);
  vec3 cool = vec3(0.66, 0.79, 1.00);
  vec3 col  = mix(warm, cool, smoothstep(0.15, 0.9, h.z));
  col = mix(vec3(1.0), col, 0.85);

  return col * core * mag * gain * tw;
}

vec3 background(vec3 rd){
  vec3 col = vec3(0.0);

  col += starLayer(rd,  42.0, 0.18, 3.20);
  col += starLayer(rd,  88.0, 0.15, 1.80);
  col += starLayer(rd, 175.0, 0.12, 0.95);
  col += starLayer(rd, 330.0, 0.09, 0.45);

  // faint interstellar medium / galactic band
  vec3  gal   = normalize(vec3(0.34, 0.86, -0.38));
  float band  = exp(-pow(dot(rd, gal), 2.0) * 9.0);
  float cloud = fbm5(rd * 2.7 + 13.0);
  float cl2   = fbm4(rd * 6.5 - 4.0);

  vec3 neb = mix(vec3(0.07, 0.10, 0.24), vec3(0.26, 0.13, 0.30), cloud);
  neb = mix(neb, vec3(0.11, 0.23, 0.30), cl2 * 0.7);
  col += neb * band * (0.10 + 0.55 * cloud * cloud) * 0.30;
  col += vec3(0.004, 0.006, 0.013) * (0.4 + cloud);

  return col;
}

/* ----------------------------- accretion disk ------------------------- */

vec3 tempColor(float t){
  t = clamp(t, 0.0, 1.0);
  vec3 c1 = vec3(0.62, 0.09, 0.02);   // outer  – deep red
  vec3 c2 = vec3(1.00, 0.34, 0.05);   //          orange
  vec3 c3 = vec3(1.00, 0.74, 0.30);   //          amber
  vec3 c4 = vec3(1.00, 0.97, 0.90);   //          white
  vec3 c5 = vec3(0.74, 0.87, 1.00);   // inner  – blue-white
  vec3 c = mix(c1, c2, smoothstep(0.00, 0.30, t));
  c = mix(c, c3, smoothstep(0.26, 0.55, t));
  c = mix(c, c4, smoothstep(0.55, 0.82, t));
  c = mix(c, c5, smoothstep(0.84, 1.00, t));
  return c;
}

// gas pattern rotated by "ang" around the disk axis
float diskNoise(vec3 p, float ang, float drift){
  float ca = cos(ang), sa = sin(ang);
  vec3  q  = vec3(p.x * ca + p.z * sa, p.y, -p.x * sa + p.z * ca);
  return fbm4(q * vec3(0.62, 1.0, 0.62) + vec3(0.0, drift, 0.0));
}

// density of the gas at a point of the mid-plane
float diskDensity(vec3 p, float r){
  float t = uTime * uSpin;
  float w = 2.6 / pow(r, 1.5);               // Keplerian angular velocity

  // Keplerian shear would wind the texture into infinitely tight rings, so the
  // pattern is carried by two phases that reset half a period apart and are
  // cross-faded (flow-noise) — the swirl never degenerates into banding.
  float ph = t / SHEAR_PERIOD;
  float f  = fract(ph);
  float wA = 1.0 - abs(2.0 * f - 1.0);
  float dr = uTime * 0.04;
  float nA = diskNoise(p, w * SHEAR_PERIOD * f,               dr);
  float nB = diskNoise(p, w * SHEAR_PERIOD * fract(ph + 0.5), dr);
  float n  = mix(nB, nA, wA);

  float d = 0.28 + 1.55 * n * n;

  d *= smoothstep(DISK_IN, DISK_IN + 1.35, r);              // soft inner edge
  d *= 1.0 - smoothstep(DISK_OUT - 4.2, DISK_OUT, r);       // soft outer edge
  d *= pow(2.6 / r, 0.9);
  return max(d, 0.0);
}

/* ------------------------------- main --------------------------------- */

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
  vec3 rd = normalize(uCamMat * vec3(uv.x * uTanFov * 2.0,
                                     uv.y * uTanFov * 2.0, 1.0));
  vec3 pos = uCamPos;
  vec3 vel = rd;

  // conserved angular momentum of the photon (per unit "energy")
  vec3  hv = cross(pos, vel);
  float h2 = dot(hv, hv);

  vec3  col   = vec3(0.0);
  float trans = 1.0;
  bool  done  = false;

  for (int i = 0; i < MAX_STEPS; i++){
    if (i >= uSteps) break;

    float r  = length(pos);
    if (r < RS){ done = true; break; }                       // event horizon
    if (r > ESCAPE && dot(pos, vel) > 0.0){                   // escaped
      col += trans * background(normalize(vel));
      done = true; break;
    }

    // adaptive step: constant swept angle near the hole, geometric far away
    float dt = 0.032 * r * r / max(sqrt(h2), 0.02);
    dt = min(dt, 0.30 * r);
    if (r < DISK_OUT + 1.5 && abs(pos.y) < 2.0) dt = min(dt, 0.16 + 0.03 * r);

    // velocity-Verlet on the null-geodesic equation
    //   a = -3/2 * rs * h^2 * r_vec / r^5      (exact orbit shape in Schwarzschild)
    float r2  = r * r;
    vec3  acc = -1.5 * RS * h2 * pos / (r2 * r2 * r) * uLens;
    vec3  np  = pos + vel * dt + 0.5 * acc * dt * dt;
    float nr  = length(np);
    float nr2 = nr * nr;
    vec3  nac = -1.5 * RS * h2 * np / (nr2 * nr2 * nr) * uLens;
    vec3  nv  = vel + 0.5 * (acc + nac) * dt;

    // --- crossing of the equatorial plane => accretion disk ---
    if (pos.y * np.y < 0.0){
      float s  = pos.y / (pos.y - np.y);
      vec3  cp = mix(pos, np, s);
      float cr = length(cp.xz);

      if (cr > DISK_IN * 0.86 && cr < DISK_OUT){
        vec3  cd  = normalize(mix(vel, nv, s));
        float dens = diskDensity(cp, cr);

        // analytic slab: longer path at grazing angles
        float tau = dens * 0.62 / max(abs(cd.y), 0.12);
        float alpha = 1.0 - exp(-min(tau, 6.0));

        // relativistic beaming + gravitational redshift
        vec3  orbit = normalize(cross(vec3(0.0, 1.0, 0.0), cp));
        float beta  = min(sqrt(0.5 * RS / cr), 0.72);
        float gamma = 1.0 / sqrt(1.0 - beta * beta);
        float dopp  = 1.0 / (gamma * (1.0 - beta * dot(orbit, -cd)));
        float grav  = sqrt(max(1.0 - RS / cr, 0.02));
        float g     = clamp(dopp * grav, 0.25, 2.6);

        float temp = pow(clamp(DISK_IN / cr, 0.0, 1.0), 1.05);
        vec3  emit = tempColor(clamp(temp * (0.55 + 0.45 * g), 0.0, 1.0));
        float power = uBright * 2.35 * pow(2.4 / cr, 2.0) * pow(g, 2.6);

        col   += trans * emit * alpha * power;
        trans *= (1.0 - alpha * 0.94);
        if (trans < 0.004){ done = true; break; }
      }
    }

    pos = np;
    vel = nv;
  }

  // rays that ran out of steps are grazing the photon sphere: they end black
  if (!done) col += trans * vec3(0.0);

  gl_FragColor = vec4(max(col, 0.0), 1.0);
}`;

/* ---- bright pass (with 4-tap downsample) ---- */
const FRAG_BRIGHT = `
precision mediump float;
varying vec2 vUv;
uniform sampler2D uTex;
uniform vec2 uTexel;
uniform float uThreshold;
void main(){
  vec3 c = texture2D(uTex, vUv + uTexel * vec2(-1.0,-1.0)).rgb
         + texture2D(uTex, vUv + uTexel * vec2( 1.0,-1.0)).rgb
         + texture2D(uTex, vUv + uTexel * vec2(-1.0, 1.0)).rgb
         + texture2D(uTex, vUv + uTexel * vec2( 1.0, 1.0)).rgb;
  c *= 0.25;
  float br = max(c.r, max(c.g, c.b));
  float k = 0.35;
  float soft = clamp(br - uThreshold + k, 0.0, 2.0 * k);
  soft = soft * soft / (4.0 * k + 1e-4);
  float w = max(soft, br - uThreshold) / max(br, 1e-4);
  gl_FragColor = vec4(c * w, 1.0);
}`;

/* ---- separable gaussian blur ---- */
const FRAG_BLUR = `
precision mediump float;
varying vec2 vUv;
uniform sampler2D uTex;
uniform vec2 uDir;
void main(){
  vec3 s = texture2D(uTex, vUv).rgb * 0.227027;
  s += (texture2D(uTex, vUv + uDir * 1.3846).rgb +
        texture2D(uTex, vUv - uDir * 1.3846).rgb) * 0.316216;
  s += (texture2D(uTex, vUv + uDir * 3.2308).rgb +
        texture2D(uTex, vUv - uDir * 3.2308).rgb) * 0.070270;
  gl_FragColor = vec4(s, 1.0);
}`;

/* ---- composite + tone mapping ---- */
const FRAG_COMPOSITE = `
precision highp float;
varying vec2 vUv;
uniform sampler2D uScene;
uniform sampler2D uBloomA;
uniform sampler2D uBloomB;
uniform float uBloom;
uniform float uExposure;
uniform vec2  uRes;

vec3 aces(vec3 x){
  float a = 2.51, b = 0.03, c = 2.43, d = 0.59, e = 0.14;
  return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0);
}

void main(){
  vec3 col = texture2D(uScene, vUv).rgb;
  vec3 bl  = texture2D(uBloomA, vUv).rgb * 0.60
           + texture2D(uBloomB, vUv).rgb * 0.32;
  col += bl * uBloom;

  col *= uExposure;
  col = aces(col);

  // vignette
  vec2 q = vUv - 0.5;
  col *= 1.0 - 0.42 * dot(q, q) * 1.6;

  col = pow(col, vec3(1.0 / 2.2));

  // ordered dithering kills banding in the deep gradients
  float dz = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453);
  col += (dz - 0.5) / 255.0;

  gl_FragColor = vec4(col, 1.0);
}`;

/* ------------------------------------------------------------------ *
 *  WebGL boilerplate
 * ------------------------------------------------------------------ */

const canvas = document.getElementById("gl");
const glOpts = { alpha:false, antialias:false, depth:false, stencil:false,
                 powerPreference:"high-performance", preserveDrawingBuffer:false };

let gl = canvas.getContext("webgl2", glOpts);
let isGL2 = !!gl;
if (!gl) gl = canvas.getContext("webgl", glOpts) || canvas.getContext("experimental-webgl", glOpts);

if (!gl) {
  document.getElementById("err").style.display = "grid";
  document.getElementById("err-msg").textContent =
    "WebGL is not available in this browser. Enable hardware acceleration and reload.";
  return;
}

/* pick the best available render-target format */
let texType = gl.UNSIGNED_BYTE, texInternal = gl.RGBA, linearOK = true;
(function pickFormat(){
  if (isGL2) {
    const cf = gl.getExtension("EXT_color_buffer_float") ||
               gl.getExtension("EXT_color_buffer_half_float");
    if (cf) { texType = gl.HALF_FLOAT; texInternal = gl.RGBA16F; }
  } else {
    const hf  = gl.getExtension("OES_texture_half_float");
    const hfl = gl.getExtension("OES_texture_half_float_linear");
    gl.getExtension("EXT_color_buffer_half_float");
    if (hf) { texType = hf.HALF_FLOAT_OES; texInternal = gl.RGBA; linearOK = !!hfl; }
  }
})();

function compile(type, src){
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS))
    throw new Error(gl.getShaderInfoLog(sh));
  return sh;
}

function program(fragSrc){
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fragSrc));
  gl.bindAttribLocation(p, 0, "aPos");
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS))
    throw new Error(gl.getProgramInfoLog(p));
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++){
    const info = gl.getActiveUniform(p, i);
    u[info.name] = gl.getUniformLocation(p, info.name);
  }
  return { p, u };
}

let progScene, progBright, progBlur, progComp;
try {
  progScene  = program(FRAG_SCENE);
  progBright = program(FRAG_BRIGHT);
  progBlur   = program(FRAG_BLUR);
  progComp   = program(FRAG_COMPOSITE);
} catch (e) {
  document.getElementById("err").style.display = "grid";
  document.getElementById("err-msg").textContent = "Shader error: " + e.message;
  return;
}

// fullscreen triangle-strip quad
const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

function makeTarget(w, h, hdr){
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  const type  = hdr ? texType : gl.UNSIGNED_BYTE;
  const inter = hdr ? texInternal : gl.RGBA;
  gl.texImage2D(gl.TEXTURE_2D, 0, inter, w, h, 0, gl.RGBA, type, null);
  const filter = (hdr && !linearOK) ? gl.NEAREST : gl.LINEAR;
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { tex, fbo, w, h, ok };
}

let rtScene = null, rtA = null, rtB = null, rtC = null, rtD = null;

function disposeTarget(rt){
  if (!rt) return;
  gl.deleteTexture(rt.tex);
  gl.deleteFramebuffer(rt.fbo);
}

function allocTargets(w, h){
  [rtScene, rtA, rtB, rtC, rtD].forEach(disposeTarget);
  rtScene = makeTarget(w, h, true);
  if (!rtScene.ok) {                      // HDR unsupported → fall back to 8 bit
    disposeTarget(rtScene);
    texType = gl.UNSIGNED_BYTE; texInternal = gl.RGBA; linearOK = true;
    rtScene = makeTarget(w, h, true);
  }
  const bw = Math.max(2, w >> 1), bh = Math.max(2, h >> 1);
  const cw = Math.max(2, w >> 2), ch = Math.max(2, h >> 2);
  rtA = makeTarget(bw, bh, true);          // half res bloom
  rtB = makeTarget(bw, bh, true);          // half res ping-pong
  rtC = makeTarget(cw, ch, true);          // quarter res wide bloom
  rtD = makeTarget(cw, ch, true);          // quarter res ping-pong
}

/* ------------------------------------------------------------------ *
 *  State & camera
 * ------------------------------------------------------------------ */

const DEFAULTS = { dist: 21.0, theta: 0.9, phi: 0.155 };

const cam = {
  dist: DEFAULTS.dist, theta: DEFAULTS.theta, phi: DEFAULTS.phi,
  vTheta: 0, vPhi: 0, tDist: DEFAULTS.dist,
  fov: 48 * Math.PI / 180
};

const opts = {
  steps: 240, bright: 1.0, spin: 1.0, lens: 1.0, bloom: 1.0,
  auto: true
};

let renderScale = 1.0;
const DPR_CAP = 2.0;
let viewW = 1, viewH = 1;          // canvas backing store
let sceneW = 1, sceneH = 1;        // ray-traced resolution

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, DPR_CAP);
  const w = Math.max(1, Math.round(canvas.clientWidth  * dpr));
  const h = Math.max(1, Math.round(canvas.clientHeight * dpr));
  if (w !== viewW || h !== viewH){
    viewW = w; viewH = h;
    canvas.width = w; canvas.height = h;
    applyScale(true);
  }
}

function applyScale(force){
  const w = Math.max(2, Math.round(viewW * renderScale));
  const h = Math.max(2, Math.round(viewH * renderScale));
  if (force || !rtScene || rtScene.w !== w || rtScene.h !== h){
    allocTargets(w, h);
    sceneW = w; sceneH = h;
    resEl.textContent = w + "×" + h;
  }
}

/* ------------------------------------------------------------------ *
 *  Input
 * ------------------------------------------------------------------ */

let dragging = false, lastX = 0, lastY = 0, pinchDist = 0, idleTimer = 0;
let pendX = 0, pendY = 0;

canvas.addEventListener("pointerdown", e => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  idleTimer = 0;
  canvas.classList.add("dragging");
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener("pointermove", e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  // apply immediately; the per-frame average becomes the release inertia
  cam.theta -= dx * 0.0052;
  cam.phi    = clamp(cam.phi + dy * 0.0040, -1.45, 1.45);
  pendX += dx; pendY += dy;
  idleTimer = 0;
});

function endDrag(e){
  if (!dragging) return;
  dragging = false;
  canvas.classList.remove("dragging");
  try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
}
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);
canvas.addEventListener("lostpointercapture", endDrag);

canvas.addEventListener("wheel", e => {
  e.preventDefault();
  const d = Math.max(-120, Math.min(120, e.deltaY));
  cam.tDist = clamp(cam.tDist * Math.exp(d * 0.0013), 4.2, 65.0);
  idleTimer = 0;
}, { passive: false });

/* pinch zoom */
canvas.addEventListener("touchmove", e => {
  if (e.touches.length === 2){
    e.preventDefault();
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const d = Math.hypot(dx, dy);
    if (pinchDist > 0) cam.tDist = clamp(cam.tDist * (pinchDist / d), 4.2, 65.0);
    pinchDist = d;
    dragging = false;
  }
}, { passive: false });
canvas.addEventListener("touchend", () => { pinchDist = 0; });

window.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (k === "h"){ document.querySelectorAll(".ui").forEach(n => n.classList.toggle("hidden")); }
  else if (k === "r"){ reset(); }
  else if (k === " "){ e.preventDefault(); setAuto(!opts.auto); }
  else if (k === "f"){
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  }
});

function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }

/* ------------------------------------------------------------------ *
 *  UI wiring
 * ------------------------------------------------------------------ */

const fpsEl = document.getElementById("fps");
const resEl = document.getElementById("res");
const autoBtn = document.getElementById("b-auto");

function bind(id, valId, fmt, apply){
  const s = document.getElementById(id), v = document.getElementById(valId);
  const upd = () => { const n = +s.value; v.textContent = fmt(n); apply(n); };
  s.addEventListener("input", upd);
  upd();
  return s;
}

const sSteps  = bind("s-steps",  "v-steps",  n => n,               n => opts.steps  = n | 0);
const sBright = bind("s-bright", "v-bright", n => n + "%",         n => opts.bright = n / 100);
const sSpin   = bind("s-spin",   "v-spin",   n => n + "%",         n => opts.spin   = n / 100);
const sLens   = bind("s-lens",   "v-lens",   n => n + "%",         n => opts.lens   = n / 100);
const sBloom  = bind("s-bloom",  "v-bloom",  n => n + "%",         n => opts.bloom  = n / 100);

function setAuto(on){
  opts.auto = on;
  autoBtn.classList.toggle("on", on);
}
autoBtn.addEventListener("click", () => setAuto(!opts.auto));
document.getElementById("b-reset").addEventListener("click", reset);

function reset(){
  cam.theta = DEFAULTS.theta;
  cam.phi   = DEFAULTS.phi;
  cam.tDist = DEFAULTS.dist;
  cam.vTheta = cam.vPhi = 0;
}

/* ------------------------------------------------------------------ *
 *  Render loop
 * ------------------------------------------------------------------ */

function drawQuad(){ gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); }

function bindTarget(rt){
  gl.bindFramebuffer(gl.FRAMEBUFFER, rt ? rt.fbo : null);
  gl.viewport(0, 0, rt ? rt.w : viewW, rt ? rt.h : viewH);
}

function useTex(unit, tex, loc){
  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.uniform1i(loc, unit);
}

let tStart = performance.now();
let tPrev = tStart;
let fpsAcc = 0, fpsFrames = 0, fpsTime = tStart, adaptAcc = 0;

function frame(now){
  requestAnimationFrame(frame);

  const dt = Math.min(0.05, (now - tPrev) / 1000);
  tPrev = now;
  const time = (now - tStart) / 1000;

  resize();

  /* --- camera integration (inertia + gentle auto-orbit) --- */
  if (dragging) {
    // per-frame drag speed becomes the flick inertia once the pointer is released
    cam.vTheta = clamp(-pendX * 0.0052 * 0.4, -0.030, 0.030);
    cam.vPhi   = clamp( pendY * 0.0040 * 0.4, -0.030, 0.030);
    pendX = pendY = 0;
  } else {
    idleTimer += dt;
    cam.theta += cam.vTheta;
    cam.phi    = clamp(cam.phi + cam.vPhi, -1.45, 1.45);
    cam.vTheta *= 0.93;
    cam.vPhi   *= 0.93;
  }
  if (opts.auto && !dragging && idleTimer > 1.2) cam.theta += dt * 0.035;
  cam.dist += (cam.tDist - cam.dist) * Math.min(1, dt * 7.0);

  const cp = Math.cos(cam.phi), sp = Math.sin(cam.phi);
  const ct = Math.cos(cam.theta), st = Math.sin(cam.theta);
  const px = cam.dist * cp * ct, py = cam.dist * sp, pz = cam.dist * cp * st;

  // basis
  let fx = -px, fy = -py, fz = -pz;
  const fl = Math.hypot(fx, fy, fz); fx /= fl; fy /= fl; fz /= fl;
  // right = normalize(cross(forward, worldUp)) = normalize(-f.z, 0, f.x)
  let rx = -fz, ry = 0, rz = fx;
  const rl = Math.hypot(rx, ry, rz) || 1; rx /= rl; ry /= rl; rz /= rl;
  // up = cross(right, forward)
  const ux = ry * fz - rz * fy;
  const uy = rz * fx - rx * fz;
  const uz = rx * fy - ry * fx;

  /* --- pass 1: geodesic ray tracing --- */
  bindTarget(rtScene);
  gl.useProgram(progScene.p);
  const U = progScene.u;
  gl.uniform2f(U.uRes, sceneW, sceneH);
  gl.uniform1f(U.uTime, time);
  gl.uniform3f(U.uCamPos, px, py, pz);
  gl.uniformMatrix3fv(U.uCamMat, false,
    new Float32Array([rx, ry, rz, ux, uy, uz, fx, fy, fz]));
  // vertical fov, widened on portrait viewports so the disk still fits
  const aspect = sceneW / sceneH;
  gl.uniform1f(U.uTanFov, Math.tan(cam.fov * 0.5) / Math.min(aspect, 1.0));
  gl.uniform1i(U.uSteps, opts.steps);
  gl.uniform1f(U.uBright, opts.bright);
  gl.uniform1f(U.uSpin, opts.spin);
  gl.uniform1f(U.uLens, opts.lens);
  drawQuad();

  /* --- pass 2: bright pass (half res) --- */
  bindTarget(rtA);
  gl.useProgram(progBright.p);
  useTex(0, rtScene.tex, progBright.u.uTex);
  gl.uniform2f(progBright.u.uTexel, 1 / sceneW, 1 / sceneH);
  gl.uniform1f(progBright.u.uThreshold, 0.72);
  drawQuad();

  /* --- pass 3: blur half res (A -> B -> A) --- */
  gl.useProgram(progBlur.p);
  bindTarget(rtB);
  useTex(0, rtA.tex, progBlur.u.uTex);
  gl.uniform2f(progBlur.u.uDir, 1 / rtA.w, 0);
  drawQuad();

  bindTarget(rtA);
  useTex(0, rtB.tex, progBlur.u.uTex);
  gl.uniform2f(progBlur.u.uDir, 0, 1 / rtA.h);
  drawQuad();

  /* --- pass 4: wide halo at quarter res (A -> C -> D -> C -> D) --- */
  bindTarget(rtC);
  useTex(0, rtA.tex, progBlur.u.uTex);
  gl.uniform2f(progBlur.u.uDir, 1.5 / rtC.w, 0);
  drawQuad();

  bindTarget(rtD);
  useTex(0, rtC.tex, progBlur.u.uTex);
  gl.uniform2f(progBlur.u.uDir, 0, 1.5 / rtC.h);
  drawQuad();

  bindTarget(rtC);
  useTex(0, rtD.tex, progBlur.u.uTex);
  gl.uniform2f(progBlur.u.uDir, 2.7 / rtC.w, 0);
  drawQuad();

  bindTarget(rtD);
  useTex(0, rtC.tex, progBlur.u.uTex);
  gl.uniform2f(progBlur.u.uDir, 0, 2.7 / rtC.h);
  drawQuad();

  /* --- pass 5: composite to screen --- */
  bindTarget(null);
  gl.useProgram(progComp.p);
  useTex(0, rtScene.tex, progComp.u.uScene);
  useTex(1, rtA.tex,     progComp.u.uBloomA);
  useTex(2, rtD.tex,     progComp.u.uBloomB);
  gl.uniform1f(progComp.u.uBloom, opts.bloom * 0.95);
  gl.uniform1f(progComp.u.uExposure, 1.05);
  gl.uniform2f(progComp.u.uRes, viewW, viewH);
  drawQuad();

  updateFps(now);
  adapt(dt);
}

function updateFps(now){
  fpsFrames++;
  if (now - fpsTime > 500){
    const f = fpsFrames * 1000 / (now - fpsTime);
    fpsEl.textContent = f.toFixed(0);
    fpsAcc = f;
    fpsTime = now;
    fpsFrames = 0;
  }
}

function adapt(dt){
  adaptAcc += dt;
  if (adaptAcc < 1.0 || fpsAcc === 0) return;
  adaptAcc = 0;
  let s = renderScale;
  if (fpsAcc < 34) s -= 0.10;
  else if (fpsAcc < 46) s -= 0.05;
  else if (fpsAcc > 57 && s < 1.0) s += 0.05;
  s = clamp(+s.toFixed(2), 0.45, 1.0);
  if (s !== renderScale){ renderScale = s; applyScale(false); }
}

/* boot */
resize();
applyScale(true);
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
